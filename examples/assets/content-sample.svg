<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">内容处理流程示意</title>
  <desc id="desc">三个相连的步骤：原文、解析规则、可读呈现；每一步用一个带编号的方框表示。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f82b7"/>
    </marker>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#f2f5fa"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="#f4f6f9"/>
  <rect x="30" y="30" width="900" height="480" rx="20" fill="url(#sheet)" stroke="#dce2ea"/>

  <text x="72" y="92" fill="#315cda" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">LOCAL SVG · CONTENT SAMPLE</text>
  <text x="72" y="130" fill="#202938" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="31" font-weight="650">从原文到可读呈现</text>
  <text x="72" y="160" fill="#5c6879" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16">本地示意图，用于图注、替代文本与失败状态演示。</text>

  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    <rect x="72" y="205" width="230" height="218" rx="14" fill="#ffffff" stroke="#dce2ea"/>
    <circle cx="106" cy="239" r="17" fill="#eef2ff" stroke="#c8d3f4"/>
    <text x="106" y="245" text-anchor="middle" fill="#315cda" font-size="15" font-weight="700">1</text>
    <text x="136" y="244" fill="#202938" font-size="18" font-weight="650">原文</text>
    <text x="96" y="286" fill="#5c6879" font-size="14">纯文本、来源与结构</text>
    <rect x="94" y="307" width="186" height="34" rx="6" fill="#f4f6f9" stroke="#e6ebf2"/>
    <text x="108" y="329" fill="#344968" font-size="13" font-family="Consolas,monospace"># 标题</text>
    <rect x="94" y="349" width="146" height="34" rx="6" fill="#f4f6f9" stroke="#e6ebf2"/>
    <text x="108" y="371" fill="#344968" font-size="13" font-family="Consolas,monospace">一段正文</text>

    <rect x="365" y="205" width="230" height="218" rx="14" fill="#ffffff" stroke="#dce2ea"/>
    <circle cx="399" cy="239" r="17" fill="#eef2ff" stroke="#c8d3f4"/>
    <text x="399" y="245" text-anchor="middle" fill="#315cda" font-size="15" font-weight="700">2</text>
    <text x="429" y="244" fill="#202938" font-size="18" font-weight="650">解析边界</text>
    <text x="388" y="286" fill="#5c6879" font-size="14">明确规则与安全净化</text>
    <rect x="388" y="307" width="186" height="34" rx="6" fill="#eef2ff" stroke="#c8d3f4"/>
    <text x="402" y="329" fill="#315cda" font-size="13" font-family="Consolas,monospace">Markdown · 公式</text>
    <rect x="388" y="349" width="186" height="34" rx="6" fill="#fff7e8" stroke="#e7d5ac"/>
    <text x="402" y="371" fill="#775018" font-size="13">危险输入 → 文本/移除</text>

    <rect x="658" y="205" width="230" height="218" rx="14" fill="#ffffff" stroke="#dce2ea"/>
    <circle cx="692" cy="239" r="17" fill="#eef2ff" stroke="#c8d3f4"/>
    <text x="692" y="245" text-anchor="middle" fill="#315cda" font-size="15" font-weight="700">3</text>
    <text x="722" y="244" fill="#202938" font-size="18" font-weight="650">呈现</text>
    <text x="682" y="286" fill="#5c6879" font-size="14">排版、图注与说明</text>
    <rect x="681" y="307" width="186" height="34" rx="6" fill="#f4f6f9" stroke="#e6ebf2"/>
    <text x="695" y="329" fill="#344968" font-size="13">标题字号与层级</text>
    <rect x="681" y="349" width="186" height="34" rx="6" fill="#f4f6f9" stroke="#e6ebf2"/>
    <text x="695" y="371" fill="#344968" font-size="13">正文、表格、代码</text>
  </g>

  <line x1="307" y1="314" x2="355" y2="314" stroke="#6f82b7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="314" x2="648" y2="314" stroke="#6f82b7" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="72" y1="460" x2="888" y2="460" stroke="#e3e8f0"/>
  <text x="72" y="487" fill="#7b8799" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13">示例仅说明组件的组合范围，不包含业务结论或教学步骤。</text>
</svg>
