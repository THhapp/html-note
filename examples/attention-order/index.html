<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关注顺序 · 从借阅请求到回执</title>
<link rel="stylesheet" href="../../dist/note-library.css">
<style>
  body { margin: 0; background: #f4f6f9; color: #202938; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  main { max-width: 1080px; margin: auto; padding: 24px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  main > p { margin: 0 0 18px; line-height: 1.65; }
  .ao-grid { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 16px; align-items: start; padding: 8px; }
  .ao-stack { display: grid; gap: 8px; min-width: 0; }
  .ao-card { min-width: 0; padding: 12px 14px; border: 1px solid #dbe4f2; border-radius: 10px; background: #fff; }
  .ao-card h2 { margin: 0 0 5px; font-size: 16px; }
  .ao-card p { margin: 0; line-height: 1.6; }
  .ao-card[data-part="receipt"][data-status="pending"] [data-value] { opacity: .65; }
  .ao-progress { display: block; margin-top: 6px; height: 2px; background: #315cda; transform: scaleX(0); transform-origin: left; }
  @media (max-width: 720px) { .ao-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>关注顺序：从借阅请求到回执</h1>
  <p>先看已有请求，再把馆藏依据、资格和借阅记录合起来读，最后确认回执。</p>
  <section data-attention-order-host aria-label="关注顺序短例"></section>
</main>
<script src="../../dist/note-library.js"></script>
<script>
(function (global) {
  'use strict';

  var NoteDemo = global.NoteDemo;
  var SceneAdapter = NoteDemo.sceneAdapter;
  var cards = {
    request: { title: '借阅请求', source: '林同学 ·《网络基础》' },
    stock: { title: '馆藏依据', source: '当前可借 1 本' },
    eligibility: { title: '资格核对', source: '等待核对', result: '资格有效' },
    record: { title: '借阅记录', source: '尚未登记', result: '已登记 1 本' },
    receipt: { title: '到期回执', source: '待生成', result: '11 月 20 日到期' }
  };
  /* 同一份观察意图给出必读成员和变化组。馆藏依据保持原状，但它是理解结果的依据。 */
  var beats = [
    { parts: ['request'] },
    { parts: ['stock', 'eligibility', 'record'], group: 'borrow' },
    { parts: ['receipt'], group: 'receipt' }
  ];
  var changes = beats.filter(function (beat) { return beat.group; });

  function ref(part) {
    return { binding: 'board', query: { part: part } };
  }

  function attentionTarget(beat) {
    var target = ref(beat.parts[0]);
    target.groups = beat.group ? [beat.group] : [];
    if (beat.parts.length > 1) {
      target.range = NoteDemo.effects.unionRange(beat.parts.slice(1).map(ref));
    }
    return target;
  }

  var adapter = SceneAdapter.define({
    name: 'attention-order',
    sceneModes: ['update'],
    defaultSceneMode: 'update',

    normalizeView: function (view) {
      if (!view || (view.stage !== 0 && view.stage !== 1)) throw new Error('需要 stage 0 或 1。');
      return { model: { stage: view.stage }, cues: {} };
    },

    mount: function (host) {
      var root = document.createElement('div');
      root.className = 'ao-grid';
      root.innerHTML = '<div data-column="request"></div><div class="ao-stack" data-column="borrow"></div><div data-column="receipt"></div>';
      var nodes = {};
      var stage = 0;
      beats.forEach(function (beat) {
        var column = root.querySelector('[data-column="' + (beat.group || 'request') + '"]');
        beat.parts.forEach(function (part) {
          var el = document.createElement('article');
          el.className = 'ao-card';
          el.dataset.part = part;
          el.innerHTML = '<h2></h2><p data-value></p><span class="ao-progress" aria-hidden="true"></span>';
          el.querySelector('h2').textContent = cards[part].title;
          column.appendChild(el);
          nodes[part] = el;
        });
      });
      host.appendChild(root);

      function paintValue(part, done) {
        var el = nodes[part];
        var card = cards[part];
        el.querySelector('[data-value]').textContent = done && card.result ? card.result : card.source;
        el.dataset.status = done || !card.result ? 'current' : 'pending';
      }

      function paintProgress(part, progress) {
        nodes[part].querySelector('.ao-progress').style.transform = 'scaleX(' + progress + ')';
      }

      function restore(model) {
        stage = model.stage;
        Object.keys(cards).forEach(function (part) {
          paintValue(part, stage === 1);
          paintProgress(part, stage === 1 && cards[part].result ? 1 : 0);
        });
      }

      function planStep(input) {
        return {
          groups: function () { return changes.map(function (beat) { return beat.group; }); },
          commit: function () {
            if (input.reduced) restore(input.targetModel);
            else stage = input.targetModel.stage;
          },
          effects: function (timing) {
            return changes.map(function (beat) {
              var parts = beat.parts.filter(function (part) { return cards[part].result; });
              return SceneAdapter.progress({
                group: beat.group,
                gate: 'ready',
                duration: timing.enterDuration,
                easing: timing.easing,
                // 放行时同步交接可读值。预置 p=0 和后续进度只写提示线。
                onStart: function () { parts.forEach(function (part) { paintValue(part, true); }); },
                update: function (progress) {
                  parts.forEach(function (part) { paintProgress(part, progress); });
                }
              });
            });
          }
        };
      }

      restore({ stage: 0 });
      return {
        restore: restore,
        readModel: function () { return { stage: stage }; },
        target: function (query) { return nodes[query && query.part] || null; },
        planStep: planStep,
        destroy: function () { root.remove(); }
      };
    }
  });

  var definition = {
    initialFrameId: 'initial',
    bindings: { board: { adapter: 'attention-order', slot: 'board' } },
    frames: [
      { id: 'initial', caption: '已收到借阅请求，等候确认资格与登记。', views: { board: { stage: 0 } } },
      { id: 'expanded', caption: '馆藏与借阅资格均满足条件，登记完成后给出到期日。', views: { board: { stage: 1 } } }
    ],
    transitions: [{
      from: 'initial',
      to: 'expanded',
      scene: {
        bindings: [{ binding: 'board', mode: 'update' }],
        timing: { enterDuration: 460, easing: 'ease-out' },
        attention: { targets: beats.map(attentionTarget) }
      }
    }]
  };

  var session = NoteDemo.mount(document.querySelector('[data-attention-order-host]'), {
    definition: definition,
    layout: function (container) {
      var slot = document.createElement('div');
      container.appendChild(slot);
      return { root: slot, slots: { board: slot } };
    },
    adapters: { 'attention-order': adapter },
    title: '借阅请求、登记与回执'
  });
  global.AttentionOrder = { session: session, definition: definition, adapter: adapter };
  global.__inspectSession = session;
})(window);
</script>
</body>
</html>
